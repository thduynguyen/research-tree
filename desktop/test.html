<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research Tree: sign-in test</title>
<style>
  html, body { height: 100%; margin: 0; font: 13px system-ui, sans-serif; color: #16181d; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #dfe2e8; background: #f4f5f7; }
  button { min-height: 30px; padding: 0 12px; border: 1px solid #c9ced8; border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
  button:hover { background: #e9edfc; }
  input { flex: 1; min-width: 0; min-height: 30px; padding: 0 10px; border: 1px solid #c9ced8; border-radius: 8px; font: inherit; }
  webview { flex: 1; }
  #note { padding: 6px 10px; color: #565d6b; border-bottom: 1px solid #dfe2e8; }
</style>
</head>
<body>
  <header>
    <button id="back" title="Back">‹</button>
    <button id="forward" title="Forward">›</button>
    <button data-go="https://claude.ai/">Claude</button>
    <button data-go="https://chatgpt.com/">ChatGPT</button>
    <button data-go="https://gemini.google.com/">Gemini</button>
    <input id="address" spellcheck="false" aria-label="Address">
  </header>
  <div id="note">Try signing in to each of the three, then ask a short question. Sign-ins are remembered for the next launch.</div>
  <webview id="view" src="https://claude.ai/" partition="persist:web" allowpopups></webview>
  <script>
    const view = document.getElementById('view');
    const address = document.getElementById('address');
    for (const button of document.querySelectorAll('[data-go]')) button.addEventListener('click', () => view.loadURL(button.dataset.go));
    document.getElementById('back').addEventListener('click', () => view.canGoBack() && view.goBack());
    document.getElementById('forward').addEventListener('click', () => view.canGoForward() && view.goForward());
    address.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const typed = address.value.trim();
      view.loadURL(/^https?:\/\//.test(typed) ? typed : `https://${typed}`);
    });
    const show = () => (address.value = view.getURL());
    view.addEventListener('did-navigate', show);
    view.addEventListener('did-navigate-in-page', show);
  </script>
</body>
</html>
